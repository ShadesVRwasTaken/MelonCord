<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Matrix Web Chat Client</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Layout Panels */
        .container { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 500px; padding: 25px; display: none; }
        .active { display: block; }
        
        /* Form Styling */
        h2 { margin-top: 0; color: #1a1d20; font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #65676b; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 1rem; transition: border 0.2s; }
        input:focus { border-color: #0084ff; outline: none; }
        
        /* Interactive Elements */
        button { width: 100%; padding: 12px; border: none; background: #0084ff; color: white; font-weight: bold; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #006dd1; }
        .error-msg { color: #e41e3f; font-size: 0.85rem; margin-top: 10px; text-align: center; min-height: 1.2rem; }

        /* Real-Time Chat Workspace */
        #chat-interface { max-width: 700px; height: 85vh; flex-direction: column; gap: 15px; }
        #chat-interface.active { display: flex; }
        .chat-header { border-bottom: 1px solid #eaebee; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { margin: 0; font-size: 1.1rem; color: #1c1e21; }
        #room-title { font-weight: normal; color: #65676b; font-size: 0.9rem; }
        
        /* Thread Timelines */
        #chat-timeline { flex: 1; background: #fafbfc; border: 1px solid #e3e6e8; border-radius: 8px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; background: #e4e6eb; color: #1c1e21; align-self: flex-start; word-break: break-word; }
        .message-bubble.own-msg { background: #0084ff; color: white; align-self: flex-end; }
        .sender-id { font-weight: bold; font-size: 0.75rem; display: block; margin-bottom: 3px; opacity: 0.8; }
        
        .controls { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="container active">
        <h2>Connect to Matrix</h2>
        <div class="form-group">
            <label for="username">Matrix Username (Local part only, e.g., 'alice')</label>
            <input type="text" id="username" placeholder="Enter username...">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password...">
        </div>
        <button onclick="handleLogin()">Login with Password</button>
        <div id="login-error" class="error-msg"></div>
    </div>

    <!-- SCREEN 2: INITIAL ROOM SETUP -->
    <div id="room-setup-screen" class="container">
        <h2>Enter Chat Room</h2>
        <p style="font-size:0.9rem; color:#65676b; text-align:center; margin-bottom: 20px;">Provide an internal Room ID (e.g. <code>!abcde:matrix.org</code>) to stream live events.</p>
        <div class="form-group">
            <label for="room-id-input">Matrix Room ID</label>
            <input type="text" id="room-id-input" placeholder="!roomid:matrix.org">
        </div>
        <button onclick="connectToRoom()">Open Room & Start Chatting</button>
        <div id="room-error" class="error-msg"></div>
    </div>

    <!-- SCREEN 3: ACTIVE LIVE CHAT INTERFACE -->
    <div id="chat-interface" class="container">
        <div class="chat-header">
            <h3>Matrix Session <span id="room-title"></span></h3>
            <button onclick="window.location.reload()" style="width:auto; padding: 6px 12px; font-size:0.8rem; background:#65676b;">Logout</button>
        </div>
        <div id="chat-timeline"></div>
        <div class="controls">
            <input type="text" id="msg-input" placeholder="Type a secure Matrix message..." onkeypress="if(event.key === 'Enter') dispatchMessage()">
            <button onclick="dispatchMessage()" style="width: auto; padding: 0 25px;">Send</button>
        </div>
    </div>

    <script>
        const BASE_URL = "https://matrix.org";
        let accessToken = null;
        let userId = null;
        let activeRoomId = null;
        let nextBatchToken = null;

        // Native password authentication pipeline
        async function handleLogin() {
            const userField = document.getElementById('username').value.trim();
            const passField = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = "";

            if (!userField || !passField) {
                errorDiv.innerText = "Please complete all registration credentials.";
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/_matrix/client/r0/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: "m.login.password",
                        user: userField,
                        password: passField
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Authentication rejected.");

                accessToken = data.access_token;
                userId = data.user_id;

                switchView('login-screen', 'room-setup-screen');
            } catch (err) {
                errorDiv.innerText = err.message || "Login sequence failure.";
            }
        }

        // Target and connect to the room path directly
        async function connectToRoom() {
            const targetRoom = document.getElementById('room-id-input').value.trim();
            const errorDiv = document.getElementById('room-error');
            errorDiv.innerText = "";

            if (!targetRoom) {
                errorDiv.innerText = "Valid targeted Room structural identifier missing.";
                return;
            }

            try {
                // Autojoin target room path
                const response = await fetch(`${BASE_URL}/_matrix/client/r0/rooms/${encodeURIComponent(targetRoom)}/join?access_token=${accessToken}`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to join room.");

                activeRoomId = targetRoom;
                document.getElementById('room-title').innerText = `(${targetRoom})`;
                switchView('room-setup-screen', 'chat-interface');
                
                // Initialize background HTTP sync polling loops
                startSyncLoop();
            } catch (err) {
                errorDiv.innerText = err.message || "Failed targeting room connection.";
            }
        }

        // Lightweight HTTP long-polling real-time update loop
        async function startSyncLoop() {
            while (activeRoomId) {
                try {
                    let syncUrl = `${BASE_URL}/_matrix/client/r0/sync?access_token=${accessToken}&timeout=30000`;
                    if (nextBatchToken) {
                        syncUrl += `&since=${nextBatchToken}`;
                    }

                    const response = await fetch(syncUrl);
                    if (!response.ok) {
                        await new Promise(resolve => setTimeout(resolve, 5000));
                        continue;
                    }

                    const data = await response.json();
                    nextBatchToken = data.next_batch;

                    // Parse the timeline payload event lists manually
                    if (data.rooms && data.rooms.join && data.rooms.join[activeRoomId]) {
                        const events = data.rooms.join[activeRoomId].timeline.events;
                        events.forEach(event => {
                            if (event.type === "m.room.message") {
                                renderMessageBubble(event.sender, event.content.body);
                            }
                        });
                    }
                } catch (e) {
                    await new Promise(resolve => setTimeout(resolve, 5000));
                }
            }
        }

        // Draw structural UI timeline items
        function renderMessageBubble(sender, content) {
            if (!content) return;
            const container = document.getElementById('chat-timeline');
            const isMe = sender === userId;

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');
            if (isMe) bubble.classList.add('own-msg');

            bubble.innerHTML = `<span class="sender-id">${sender}</span>${escapeHTML(content)}`;
            
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight; 
        }

        // Dispatch text vectors securely over standard fetch requests
        async function dispatchMessage() {
            const textInput = document.getElementById('msg-input');
            const dataText = textInput.value.trim();
            if (!dataText || !activeRoomId) return;

            const txnId = Date.now();
            try {
                textInput.value = "";
                await fetch(`${BASE_URL}/_matrix/client/r0/rooms/${encodeURIComponent(activeRoomId)}/send/m.room.message/${txnId}?access_token=${accessToken}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        msgtype: "m.text",
                        body: dataText
                    })
                });
            } catch (err) {
                alert("Failed forwarding outgoing stream packet payload.");
            }
        }

        // Global viewport layout switcher
        function switchView(hideId, showId) {
            document.getElementById(hideId).classList.remove('active');
            document.getElementById(showId).classList.add('active');
        }

        // Essential XSS anti-injection mapping filters
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
